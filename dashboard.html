<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .login-badge {
            background: #eef2ff;
            color: #4f46e5;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #c7d2fe;
        }

        .profile {
            padding: 10px 16px;
            border-radius: 25px;
            background: #f1f1f1;
            cursor: pointer;
            font-weight: bold;
        }

        .content {
            min-height: calc(100vh - 70px);
            padding: 40px 20px;
            color: white;
            text-align: center;
        }

        .upload-box {
            background: white;
            color: #333;
            padding: 30px;
            max-width: 900px;
            margin: auto;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .upload-box h1 {
            margin-bottom: 10px;
        }

        .upload-box p {
            color: #777;
            margin-bottom: 20px;
        }

        .upload-btn {
            padding: 14px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-btn:hover {
            background: #5568d8;
        }

        #fileInput {
            display: none;
        }

        #fileList {
            margin-top: 30px;
        }

        .photo-card {
            background: #f5f5f5;
            padding: 15px;
            margin-top: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .photo-name {
            font-size: 15px;
            font-weight: bold;
            word-break: break-word;
            text-align: left;
            flex: 1;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .open-btn,
        .download-btn,
        .delete-btn {
            border: none;
            text-decoration: none;
            color: white;
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        .open-btn {
            background: #667eea;
        }

        .open-btn:hover {
            background: #5568d8;
        }

        .download-btn {
            background: #28a745;
        }

        .download-btn:hover {
            background: #218838;
        }

        .delete-btn {
            background: #dc3545;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        #photoViewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
        }

        #photoViewer img {
            max-width: 85%;
            max-height: 75%;
            border-radius: 10px;
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 25px;
            border: none;
            background: #dc3545;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .close-btn:hover {
            background: #c82333;
        }

        @media (max-width: 600px) {
            .photo-card {
                flex-direction: column;
                align-items: stretch;
            }

            .buttons {
                justify-content: center;
                flex-wrap: wrap;
            }

            .nav-right {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <div class="logo">
            📷 My Photo Dashboard
        </div>

        <div class="nav-right">
            <div class="login-badge" id="loginCounter">
                🔄 Visits: 0
            </div>
            <div class="profile" onclick="openProfile()">
                👤 Your Profile
            </div>
        </div>
    </div>

    <div class="content">
        <div class="upload-box">
            <h1>Welcome to your Dashboard</h1>
            <p>Upload multiple photos and manage your documents.</p>

            <button class="upload-btn" onclick="openFilePicker()">
                📁 Upload Photos
            </button>

            <input type="file" id="fileInput" multiple accept="image/*">

            <div id="fileList"></div>
        </div>
    </div>

    <!-- Photo Viewer Modal -->
    <div id="photoViewer">
        <img id="viewerImage" src="" alt="Photo">
        <button class="close-btn" onclick="closePhoto()">
            ✖ Close
        </button>
    </div>

    <script>
        // --- 1. LOGIN / VISIT COUNTER (localStorage) ---
        let currentLogins = localStorage.getItem("dashboard_login_count");
        currentLogins = currentLogins ? parseInt(currentLogins, 10) + 1 : 1;
        localStorage.setItem("dashboard_login_count", currentLogins);

        document.getElementById("loginCounter").innerText = `🔑 Login Count: ${currentLogins}`;

        function openProfile() {
            alert(`Profile Info:\nYou have opened/logged into this dashboard ${currentLogins} time(s).`);
        }

        function openFilePicker() {
            document.getElementById("fileInput").click();
        }

        // --- 2. PERSISTENT STORAGE FOR IMAGES (IndexedDB) ---
        let db;
        const request = indexedDB.open("PhotoDashboardDB", 1);

        request.onupgradeneeded = function (e) {
            db = e.target.result;
            if (!db.objectStoreNames.contains("photos")) {
                db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
            }
        };

        request.onsuccess = function (e) {
            db = e.target.result;
            loadStoredPhotos();
        };

        request.onerror = function () {
            console.error("Failed to initialize IndexedDB");
        };

        // Render card to DOM
        function renderCard(id, name, blob) {
            const fileList = document.getElementById("fileList");
            const imageURL = URL.createObjectURL(blob);

            const card = document.createElement("div");
            card.className = "photo-card";
            card.dataset.id = id;

            const nameDiv = document.createElement("div");
            nameDiv.className = "photo-name";
            nameDiv.innerHTML = "📄 " + name;

            const buttons = document.createElement("div");
            buttons.className = "buttons";

            // Open button
            const openButton = document.createElement("button");
            openButton.className = "open-btn";
            openButton.innerHTML = "👁 Open";
            openButton.onclick = function () {
                openPhoto(imageURL);
            };

            // Download button
            const downloadButton = document.createElement("a");
            downloadButton.className = "download-btn";
            downloadButton.innerHTML = "⬇ Download";
            downloadButton.href = imageURL;
            downloadButton.download = name;

            // Delete button
            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-btn";
            deleteButton.innerHTML = "🗑 Delete";
            deleteButton.onclick = function () {
                if (confirm("Are you sure you want to delete " + name + "?")) {
                    deletePhoto(id, card, imageURL);
                }
            };

            buttons.appendChild(openButton);
            buttons.appendChild(downloadButton);
            buttons.appendChild(deleteButton);

            card.appendChild(nameDiv);
            card.appendChild(buttons);
            fileList.appendChild(card);
        }

        // Load files from IndexedDB
        function loadStoredPhotos() {
            const tx = db.transaction("photos", "readonly");
            const store = tx.objectStore("photos");
            const getAll = store.openCursor();

            getAll.onsuccess = function (e) {
                const cursor = e.target.result;
                if (cursor) {
                    renderCard(cursor.value.id, cursor.value.name, cursor.value.fileBlob);
                    cursor.continue();
                }
            };
        }

        // Save new photos into IndexedDB
        document.getElementById("fileInput").addEventListener("change", function () {
            const files = this.files;
            if (!files.length) return;

            const tx = db.transaction("photos", "readwrite");
            const store = tx.objectStore("photos");

            Array.from(files).forEach((file) => {
                if (!file.type.startsWith("image/")) return;

                const photoData = {
                    name: file.name,
                    fileBlob: file,
                    createdAt: new Date().toISOString()
                };

                const addRequest = store.add(photoData);
                addRequest.onsuccess = function (e) {
                    renderCard(e.target.result, file.name, file);
                };
            });

            this.value = "";
        });

        // Delete photo from IndexedDB and DOM
        function deletePhoto(id, cardElement, objectUrl) {
            const tx = db.transaction("photos", "readwrite");
            const store = tx.objectStore("photos");

            store.delete(id).onsuccess = function () {
                URL.revokeObjectURL(objectUrl);
                cardElement.remove();
            };
        }

        // --- 3. PHOTO VIEWER MODAL ---
        function openPhoto(imageURL) {
            const viewer = document.getElementById("photoViewer");
            const image = document.getElementById("viewerImage");
            image.src = imageURL;
            viewer.style.display = "flex";
        }

        function closePhoto() {
            document.getElementById("photoViewer").style.display = "none";
            document.getElementById("viewerImage").src = "";
        }

        document.getElementById("photoViewer").addEventListener("click", function(event) {
            if (event.target === this) {
                closePhoto();
            }
        });
    </script>
</body>
</html>
