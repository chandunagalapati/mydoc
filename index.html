<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        /* --- ANIMATED WELCOME SCREEN --- */
        #welcome {
            color: #333;
            animation: zoomIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .logo-icon {
            font-size: 60px;
            margin-bottom: 10px;
            display: inline-block;
        }

        #welcome h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #667eea;
        }

        #welcome p {
            color: #777;
            font-size: 16px;
        }

        /* Scale from small (0.2) to full size (1) with opacity fade */
        @keyframes zoomIn {
            0% {
                opacity: 0;
                transform: scale(0.2);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        #main {
            display: none;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .register-btn {
            background: #667eea;
            color: white;
        }

        .login-btn {
            background: #eee;
            color: #333;
        }

        .back-btn {
            background: #ddd;
            color: #333;
        }

        button:hover {
            opacity: 0.85;
        }

        #register,
        #login {
            display: none;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            color: #444;
            margin-top: 5px;
        }

        #message,
        #loginMessage {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <!-- WELCOME SCREEN -->
        <div id="welcome">
            <div class="logo-icon">🌟</div>
            <h1>WELCOME</h1>
            <p>Welcome to My Website</p>
        </div>

        <!-- MAIN MENU -->
        <div id="main">
            <h2>Welcome</h2>
            <button class="register-btn" onclick="showRegister()">REGISTER</button>
            <button class="login-btn" onclick="showLogin()">LOGIN</button>
        </div>

        <!-- REGISTER FORM -->
        <div id="register">
            <h2>Create Account</h2>

            <label>Name</label>
            <input type="text" id="registerName" placeholder="Enter your name">

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Enter password again">

            <button class="register-btn" onclick="registerUser()">REGISTER</button>
            <button class="back-btn" onclick="goBack()">BACK</button>

            <p id="message"></p>
        </div>

        <!-- LOGIN FORM -->
        <div id="login">
            <h2>Welcome Back</h2>

            <label>Name</label>
            <input type="text" id="loginName" placeholder="Enter your name">

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter password">

            <button class="register-btn" onclick="loginUser()">LOGIN</button>
            <button class="back-btn" onclick="goBack()">BACK</button>

            <p id="loginMessage"></p>
        </div>

    </div>

    <script>
        // -------------------------
        // PLAY CHIME SOUND (Web Audio API)
        // -------------------------
        function playWelcomeSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const ctx = new AudioContext();

                // Two pleasant ascending harmonic tones
                const notes = [523.25, 659.25]; // C5 to E5

                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = "sine";
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.15);

                    gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.15);
                    gain.gain.linearRampToValueAtTime(0.2, ctx.currentTime + idx * 0.15 + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.15 + 0.6);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(ctx.currentTime + idx * 0.15);
                    osc.stop(ctx.currentTime + idx * 0.15 + 0.6);
                });
            } catch (e) {
                // Audio autoplay might be limited until user interaction depending on browser policy
            }
        }

        // Start welcome audio on load (or on first click if autoplay policy blocks it)
        window.addEventListener("load", () => {
            playWelcomeSound();
        });
        document.body.addEventListener("click", () => {
            playWelcomeSound();
        }, { once: true });

        // -------------------------
        // WELCOME SCREEN TRANSITION
        // -------------------------
        setTimeout(function() {
            document.getElementById("welcome").style.display = "none";
            document.getElementById("main").style.display = "block";
        }, 2000);

        // -------------------------
        // NAVIGATION HANDLERS
        // -------------------------
        function showRegister() {
            document.getElementById("main").style.display = "none";
            document.getElementById("login").style.display = "none";
            document.getElementById("register").style.display = "block";

            document.getElementById("registerName").value = "";
            document.getElementById("password").value = "";
            document.getElementById("confirmPassword").value = "";
            document.getElementById("message").innerHTML = "";
        }

        function showLogin() {
            document.getElementById("main").style.display = "none";
            document.getElementById("register").style.display = "none";
            document.getElementById("login").style.display = "block";

            document.getElementById("loginName").value = "";
            document.getElementById("loginPassword").value = "";
            document.getElementById("loginMessage").innerHTML = "";
        }

        function goBack() {
            document.getElementById("register").style.display = "none";
            document.getElementById("login").style.display = "none";
            document.getElementById("main").style.display = "block";
        }

        // -------------------------
        // REGISTER USER
        // -------------------------
        function registerUser() {
            let name = document.getElementById("registerName").value.trim();
            let password = document.getElementById("password").value;
            let confirmPassword = document.getElementById("confirmPassword").value;
            let message = document.getElementById("message");

            if (name === "" || password === "" || confirmPassword === "") {
                message.style.color = "red";
                message.innerHTML = "❌ Please fill all fields.";
                return;
            }

            if (password !== confirmPassword) {
                message.style.color = "red";
                message.innerHTML = "❌ Passwords do not match.";
                return;
            }

            let savedUser = JSON.parse(localStorage.getItem("user"));
            if (savedUser !== null) {
                message.style.color = "red";
                message.innerHTML = "❌ An account is already registered.";
                return;
            }

            let user = { name: name, password: password };
            localStorage.setItem("user", JSON.stringify(user));

            message.style.color = "green";
            message.innerHTML = "✅ Registration successful!";

            document.getElementById("registerName").value = "";
            document.getElementById("password").value = "";
            document.getElementById("confirmPassword").value = "";
        }

        // -------------------------
        // LOGIN USER
        // -------------------------
        function loginUser() {
            let name = document.getElementById("loginName").value.trim();
            let password = document.getElementById("loginPassword").value;
            let loginMessage = document.getElementById("loginMessage");

            if (name === "" || password === "") {
                loginMessage.style.color = "red";
                loginMessage.innerHTML = "❌ Please enter name and password.";
                return;
            }

            let savedUser = JSON.parse(localStorage.getItem("user"));
            if (savedUser === null) {
                loginMessage.style.color = "red";
                loginMessage.innerHTML = "❌ No account found. Please register first.";
                return;
            }

            if (name === savedUser.name && password === savedUser.password) {
                loginMessage.style.color = "green";
                loginMessage.innerHTML = "✅ Login successful!";

                setTimeout(function() {
                    window.location.href = "dashboard.html";
                }, 1000);
            } else {
                loginMessage.style.color = "red";
                loginMessage.innerHTML = "❌ Incorrect name or password.";
            }
        }
    </script>

</body>

</html>
